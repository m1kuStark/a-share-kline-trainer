name: 问题反馈
description: 提供版本与复现步骤，帮助定位使用中的故障。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请勿上传个人交易记录、训练数据库或包含本机路径的完整日志。安全问题请按 SECURITY.md 的说明报告。
  - type: input
    id: version
    attributes:
      label: 训练器版本
      placeholder: "例如 v1.2.7；安装包或源码运行"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统与浏览器
      placeholder: "例如 Windows 11 / Edge"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开训练器\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期表现
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际表现
      description: 可附截图或已去掉个人信息的报错片段。
    validations:
      required: true
