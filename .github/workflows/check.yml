# Windows-only matrix per user decision on 2026-10-07: the product targets Windows only,
# so Linux jobs were removed (ubuntu failures were Windows-specific test infrastructure debt).
# 2026-11-11: split into docs / verify / pr-policy. These job names are the contract used by
# the main branch Ruleset required checks in docs/engineering/ci.md — rename them only together.
name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: windows-latest
    timeout-minutes: 10
    # 统一状态在仓库外；CI 无 .control 时无法校验生成区新鲜度，显式降级为 WARN。
    env:
      TRAINER_DOCS_ALLOW_MISSING_STATE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run docs:status -- --check

  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test source and compiled launcher
        run: node scripts/ci/run-tests-with-retry.mjs
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-latest
          path: test-results.json
          if-no-files-found: ignore
          retention-days: 7

  pr-policy:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - run: node scripts/ci/check-pr-policy.mjs
