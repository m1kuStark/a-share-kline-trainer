version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-production:
        dependency-type: production
        update-types: ["minor", "patch"]
      npm-development:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # 钉定依赖：图表适配层要求 klinecharts 10.0.3，升级必须单独评审 + 图表/视觉回归。
      - dependency-name: klinecharts
      # 所有 major 升级必须专项任务；日常只自动分组 minor/patch（DEP-POLICY-01）。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      # GitHub Actions 大版本同样走专项任务。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns: ["*"]
