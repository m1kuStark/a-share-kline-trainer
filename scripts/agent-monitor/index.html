<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLM 任务看板</title>
<style>
:root{font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:#e3e8f1;background:#10151d;color-scheme:dark}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}header{padding:24px 32px 20px;border-bottom:1px solid #2b3442;display:flex;align-items:center;justify-content:space-between;gap:18px}h1{font-size:23px;margin:0 0 8px}p{margin:0;color:#9eadc0;font-size:13px;line-height:1.7}.connection{font-size:12px;color:#9eadc0;text-align:right}.connection b{display:block;color:#79dabb;margin-bottom:5px}main{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100vh - 108px)}nav{padding:20px 16px;border-right:1px solid #2b3442}nav button{display:block;text-align:left;width:100%;border:1px solid transparent;padding:16px;border-radius:8px;background:transparent;color:inherit;margin-bottom:8px}nav button:hover{background:#1b2430}nav button.selected{background:#202d3a;border-color:#4b8b92}nav strong{display:block;font-size:14px;margin:8px 0}nav small{color:#9eadc0}.badge{display:inline-block;padding:3px 8px;font-size:11px;border-radius:4px;color:#b8c9db;background:#283546}.running{color:#75e4bf;background:#123d34}.failed,.interrupted,.needs_changes{color:#ffa8a0;background:#482722}.awaiting_review{color:#f1ce88;background:#40351e}.reviewed{color:#97bdff;background:#243857}article{padding:27px 32px;min-width:0;max-width:1280px}h2{font-size:23px;margin:14px 0 8px}h3{font-size:14px;margin:0 0 14px}section{padding:22px 0;border-top:1px solid #2b3442}.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:24px 0}.meta div{background:#19222e;padding:14px;border-radius:6px;min-width:0}.meta span{display:block;color:#8c9db3;font-size:11px;margin-bottom:8px}.meta strong{font-size:13px;overflow-wrap:anywhere;font-weight:500}.path{font-family:Consolas,monospace;font-size:12px;color:#9aacc3;overflow-wrap:anywhere}.notice{border-left:3px solid #d0a75b;background:#2a251d;color:#dfc994;padding:12px 14px;font-size:13px;line-height:1.6;margin:15px 0}.activity{display:grid;grid-template-columns:160px 90px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid #222e3d;font-size:12px;line-height:1.6}.activity time,.activity .tool{color:#93a7bf}.activity .desc{overflow-wrap:anywhere}.activity small{display:block;color:#7f93aa}.muted{color:#8c9db3;font-size:12px}pre{font:13px/1.7 'Segoe UI','Microsoft YaHei',sans-serif;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0;padding:18px;border-radius:7px;background:#17202b;border:1px solid #293747}summary{cursor:pointer;font-size:14px;color:#bbd3eb}.empty{padding:50px 20px;color:#9eadc0}#error:empty{display:none}#error{padding:12px 32px;background:#482722;color:#ffd2cb}.toolbar button{color:#c7d4e4;border:1px solid #3b4d64;background:transparent;padding:7px 12px;border-radius:5px}.toolbar{display:flex;align-items:center;gap:12px;margin-top:14px}@media(max-width:850px){header{padding:18px}main{grid-template-columns:230px minmax(0,1fr)}article{padding:20px}.meta{grid-template-columns:1fr}.activity{grid-template-columns:1fr;gap:3px}}@media(prefers-color-scheme:light){:root{color:#182c40;background:#f7f9fb;color-scheme:light}nav button.selected{background:#e6eff3}nav button:hover{background:#edf2f6}.meta div,pre{background:#edf2f7}pre{border-color:#d8e1e9}header,nav,section{border-color:#d8e1e9}.activity{border-color:#e0e7ee}.notice{background:#fff3db;color:#705615}p,.connection,nav small,.path,.meta span,.muted,.activity time,.activity .tool,.activity small{color:#536a81}summary{color:#215a84}.connection b{color:#13775c}}
</style>
<header><div><h1>GLM 任务看板</h1><p>后台开发的现场记录。关闭此窗口不影响任务运行；查看和刷新不消耗模型额度。</p></div><div class="connection"><b id="connection">正在连接</b><span id="refreshed"></span></div></header>
<div id="error" role="alert"></div><main><nav aria-label="任务列表" id="jobs"></nav><article id="detail"><div class="empty">正在读取任务…</div></article></main>
<script>
const labels={queued:'待派发',running:'运行中',awaiting_review:'开发完成 · 待验收',reviewed:'模块已复核',needs_changes:'需修正',failed:'执行失败',interrupted:'进程已退出 · 需检查'};
const statuses={completed:'完成',running:'执行中',pending:'等待',error:'失败'};
let selected=null,lastSignature='',lastJobs=[],refreshing=false;
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
const date=t=>t?new Date(t).toLocaleString('zh-CN',{hour12:false}):'未记录';
const age=t=>{if(!t)return'暂无活动';const n=Math.max(0,Math.floor((Date.now()-t)/1000));return n<60?n+' 秒前':Math.floor(n/60)+' 分钟前'};
function badge(job){return el('span',labels[job.phase]||job.phase,'badge '+job.phase)}
function render(jobs){const openPanels=new Set([...document.querySelectorAll('article details[open] summary')].map(e=>e.textContent));lastJobs=jobs;if(!jobs.some(j=>j.id===selected))selected=jobs[0]?.id;const nav=document.getElementById('jobs');nav.replaceChildren();for(const job of jobs){const button=el('button');button.className=job.id===selected?'selected':'';button.append(badge(job),el('strong',job.title),el('small',job.branch||job.id));button.onclick=()=>{selected=job.id;lastSignature='';render(lastJobs)};nav.append(button)}const job=jobs.find(j=>j.id===selected),detail=document.getElementById('detail');detail.replaceChildren();if(!job){detail.append(el('div','尚未登记任务','empty'));return}detail.append(badge(job),el('h2',job.title),el('div',job.worktree,'path'));const meta=el('div',undefined,'meta');for(const [name,value]of [['模型 / 思考档',`${job.model||'GLM-5.3-Flash'} / ${job.effort||'max'}`],['开始 / 结束',`${date(job.startedAt)} → ${job.finishedAt?date(job.finishedAt):'—'}`],['最近活动',`${date(job.lastActivity)} · ${age(job.lastActivity)}`]]){const cell=el('div');cell.append(el('span',name),el('strong',value));meta.append(cell)}detail.append(meta);
 if(job.phase==='running'){const req=job.request;detail.append(el('div',req?.status==='running'?'模型请求正在进行。长时间思考时，工具列表可能暂时不变。':'后台进程仍在运行，等待下一次会话活动。','notice'));if(job.lastActivity&&Date.now()-job.lastActivity>600000)detail.append(el('p','超过 10 分钟未出现新活动：可能仍在思考，也可能遇到阻碍，请结合最近工具和错误判断。','notice'))}
 if(job.phase==='awaiting_review')detail.append(el('div','GLM 已结束本项开发。以下答复由开发 Agent 提供，尚不等于集成人验收通过。','notice'));
 if(job.error||job.warning)detail.append(el('div',[job.error,job.warning].filter(Boolean).join('\n'),'notice'));
 if(job.review){const sec=el('section');sec.append(el('h3','验收反馈'),el('p',job.review.summary||job.review.state));detail.append(sec)}
 const prompt=el('details');prompt.append(el('summary','查看本次任务要求'),el('pre',job.prompt||'未记录 Prompt'));detail.append(prompt);
 if(job.response){const sec=el('section');sec.append(el('h3','GLM 完成答复'),el('pre',job.response));detail.append(sec)}
 const sec=el('section');sec.append(el('h3','最近工具操作'));if(!job.activity?.length)sec.append(el('p','暂无工具记录；待派发任务和模型开始思考时可能出现此状态。'));for(const a of job.activity||[]){const row=el('div',undefined,'activity'),desc=el('div',a.description,'desc');desc.append(el('small',statuses[a.status]||a.status));row.append(el('time',date(a.at)),el('span',a.tool,'tool'),desc);sec.append(row)}detail.append(sec);
 const info=el('details');info.append(el('summary','日志与运行信息'),el('pre',`任务：${job.id}\n会话：${job.sessionId||'尚未建立'}\n日志：${job.logPath||'未记录'}\n配置上下文：${job.contextConfigured||1000000}（实际生效容量未核实）\n刷新：窗口打开时每 5 秒读取本机状态；不发送模型请求。`));detail.append(info);const toolbar=el('div',undefined,'toolbar'),copy=el('button','复制日志路径');copy.onclick=async()=>{await navigator.clipboard.writeText(job.logPath||'');copy.textContent='已复制'};toolbar.append(copy);detail.append(toolbar);for(const panel of detail.querySelectorAll('details'))panel.open=openPanels.has(panel.querySelector('summary')?.textContent)}
async function refresh(){if(refreshing||document.hidden)return;refreshing=true;try{const response=await fetch('state',{cache:'no-store',signal:AbortSignal.timeout(5000)});if(!response.ok)throw new Error('状态服务返回 '+response.status);const data=await response.json();document.getElementById('connection').textContent='本机监控已连接';document.getElementById('refreshed').textContent='更新于 '+date(data.generatedAt);document.getElementById('error').textContent=data.warnings.join('；');const signature=JSON.stringify(data.jobs);if(signature!==lastSignature){lastSignature=signature;render(data.jobs)}else{const current=data.jobs.find(j=>j.id===selected),stamp=document.querySelector('.meta div:last-child strong');if(current&&stamp)stamp.textContent=date(current.lastActivity)+' · '+age(current.lastActivity)}}catch(error){document.getElementById('connection').textContent='连接已断开';document.getElementById('error').textContent='状态窗口暂时无法读取数据；这不代表 GLM 已停止。重新打开桌面上的“GLM 任务看板”可恢复服务。'}finally{refreshing=false}}
refresh();setInterval(refresh,5000);document.addEventListener('visibilitychange',refresh);
</script></html>
