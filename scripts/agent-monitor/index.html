<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务看板</title>
<style>
:root{font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:#e3e8f1;background:#10151d;color-scheme:dark}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}header{padding:24px 32px 20px;border-bottom:1px solid #2b3442;display:flex;align-items:center;justify-content:space-between;gap:18px}h1{font-size:23px;margin:0 0 8px}p{margin:0;color:#9eadc0;font-size:13px;line-height:1.7}.connection{font-size:12px;color:#9eadc0;text-align:right}.connection b{display:block;color:#79dabb;margin-bottom:5px}main{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100vh - 108px)}nav{padding:20px 16px;border-right:1px solid #2b3442}nav button{display:block;text-align:left;width:100%;border:1px solid transparent;padding:16px;border-radius:8px;background:transparent;color:inherit;margin-bottom:8px}nav button:hover{background:#1b2430}nav button.selected{background:#202d3a;border-color:#4b8b92}nav strong{display:block;font-size:14px;margin:8px 0}nav small{color:#9eadc0}.badge{display:inline-block;padding:3px 8px;font-size:11px;border-radius:4px;color:#b8c9db;background:#283546}.running{color:#75e4bf;background:#123d34}.failed,.interrupted,.needs_changes{color:#ffa8a0;background:#482722}.awaiting_review{color:#f1ce88;background:#40351e}.reviewed{color:#97bdff;background:#243857}.resolved{color:#97bdff;background:#243857}#history-group{border:1px solid #2b3442;border-radius:8px;margin:4px 0 14px;padding:6px 8px}#history-group summary{cursor:pointer;color:#9eadc0;font-size:12px;padding:6px 8px;user-select:none}.summary{padding:2px 16px 14px}.summary strong{display:block;font-size:12px;color:#c7d4e4;margin-bottom:4px}.summary small{display:block;color:#9eadc0;font-size:12px;line-height:1.7}.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.chain button{border:1px solid #3b4d64;background:transparent;color:#c7d4e4;padding:5px 10px;border-radius:5px;font-size:12px}.chain button.here{border-color:#4b8b92;background:#202d3a;cursor:default}.chain .arrow{color:#8c9db3}article{padding:27px 32px;min-width:0;max-width:1280px}h2{font-size:23px;margin:14px 0 8px}h3{font-size:14px;margin:0 0 14px}section{padding:22px 0;border-top:1px solid #2b3442}.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:24px 0}.meta div{background:#19222e;padding:14px;border-radius:6px;min-width:0}.meta span{display:block;color:#8c9db3;font-size:11px;margin-bottom:8px}.meta strong{font-size:13px;overflow-wrap:anywhere;font-weight:500}.path{font-family:Consolas,monospace;font-size:12px;color:#9aacc3;overflow-wrap:anywhere}.notice{border-left:3px solid #d0a75b;background:#2a251d;color:#dfc994;padding:12px 14px;font-size:13px;line-height:1.6;margin:15px 0}.activity{display:grid;grid-template-columns:160px 90px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid #222e3d;font-size:12px;line-height:1.6}.activity time,.activity .tool{color:#93a7bf}.activity .desc{overflow-wrap:anywhere}.activity small{display:block;color:#7f93aa}.muted{color:#8c9db3;font-size:12px}pre{font:13px/1.7 'Segoe UI','Microsoft YaHei',sans-serif;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0;padding:18px;border-radius:7px;background:#17202b;border:1px solid #293747}summary{cursor:pointer;font-size:14px;color:#bbd3eb}.empty{padding:50px 20px;color:#9eadc0}#error:empty{display:none}#error{padding:12px 32px;background:#482722;color:#ffd2cb}.toolbar button{color:#c7d4e4;border:1px solid #3b4d64;background:transparent;padding:7px 12px;border-radius:5px}.toolbar{display:flex;align-items:center;gap:12px;margin-top:14px}@media(max-width:850px){header{padding:18px}main{grid-template-columns:230px minmax(0,1fr)}article{padding:20px}.meta{grid-template-columns:1fr}.activity{grid-template-columns:1fr;gap:3px}}@media(prefers-color-scheme:light){:root{color:#182c40;background:#f7f9fb;color-scheme:light}nav button.selected{background:#e6eff3}nav button:hover{background:#edf2f6}.meta div,pre{background:#edf2f7}pre{border-color:#d8e1e9}header,nav,section{border-color:#d8e1e9}.activity{border-color:#e0e7ee}.notice{background:#fff3db;color:#705615}p,.connection,nav small,.path,.meta span,.muted,.activity time,.activity .tool,.activity small{color:#536a81}summary{color:#215a84}#history-group{border-color:#d8e1e9}.summary strong{color:#182c40}.summary small{color:#536a81}.chain button{border-color:#b9c8d6;color:#182c40}.chain button.here{background:#e6eff3}.connection b{color:#13775c}}
</style>
<style>
#quota-region{border-bottom:1px solid #2b3442;padding:12px 32px;display:flex;flex-direction:column;gap:8px}
.quota-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.quota-head strong{font-size:14px}
.quota-status,.quota-account,.quota-metric,.quota-scope,nav strong,nav small,h2{overflow-wrap:anywhere}
.quota-status{font-size:12px;color:#9eadc0}
.q-loading{color:#9eadc0}.q-available{color:#75e4bf}.q-unavailable{color:#ffa8a0}.q-stale{color:#f1ce88}
.quota-head button{color:#c7d4e4;border:1px solid #3b4d64;background:transparent;padding:4px 10px;border-radius:5px;font-size:12px}
.quota-head button:disabled{opacity:.5;cursor:default}
.quota-head a{font-size:12px;color:#79dabb}
.quota-accounts{display:flex;flex-wrap:wrap;gap:10px}
.quota-account{border:1px solid #2b3442;border-radius:8px;padding:10px 12px;font-size:12px;min-width:220px;max-width:100%;overflow-wrap:anywhere}
.quota-title{font-weight:600;margin-bottom:4px}
.quota-scope{color:#8c9db3;margin-top:4px;line-height:1.6}
.quota-metrics{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.quota-metric{background:#19222e;padding:3px 8px;border-radius:5px}
.quota-account{flex:1 1 290px}.quota-account .q-stale{font-weight:600}
#usage-block .meta{margin:12px 0;gap:8px}#usage-block .meta div{padding:10px}#usage-block .usage-counts{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1100px){#usage-block .usage-counts{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){header{flex-wrap:wrap}main{display:block;min-height:0}nav{border-right:none;border-bottom:1px solid #2b3442;padding:12px}article{padding:16px}#quota-region{padding:12px 16px}.quota-account{min-width:0;width:100%}}
@media(prefers-color-scheme:light){#quota-region,nav{border-color:#d8e1e9}.quota-head button{color:#182c40;border-color:#b9c8d6}.quota-head a{color:#13775c}.quota-account{border-color:#d8e1e9}.quota-metric{background:#e4ebf2}.q-available{color:#13775c}.q-stale{color:#8a6a10}.q-unavailable{color:#b03a2e}}
</style>
<header><div><h1>任务看板</h1><p>GLM 后台开发与本机自动门禁的现场记录。关闭此窗口不影响任务运行；查看和刷新不消耗模型额度。</p></div><div class="connection"><b id="connection">正在连接</b><span id="refreshed"></span></div></header>
<div id="error" role="alert"></div><section id="quota-region" aria-label="账号额度"><div class="quota-status">正在读取账号额度…</div></section><main><nav aria-label="任务列表" id="jobs"></nav><article id="detail"><div class="empty">正在读取任务…</div></article></main>
<script>
const labels={queued:'待派发',starting:'启动中',running:'运行中',awaiting_review:'开发完成 · 待验收',reviewed:'模块已复核',needs_changes:'需修正',failed:'执行失败',interrupted:'进程已退出 · 需检查',cancelled:'已撤回'};
const statuses={completed:'完成',running:'执行中',pending:'等待',error:'失败'};
const kinds={glm:'GLM 开发任务',local:'本机自动门禁'};
const successorNotes={queued:'后继待派发',starting:'修复启动中',running:'修复执行中',awaiting_review:'修复已待验收',reviewed:'后续已复核通过',needs_changes:'后继待修正',failed:'后继执行失败',interrupted:'后继进程退出',cancelled:'后继已撤回'};
const attentionPhases=['needs_changes','failed','interrupted'];
let selected=null,lastSignature='',lastJobs=[],lastSummary={running:0,awaitingReview:0,needsAttention:0},refreshing=false,lastOpenPanels=new Set();
let usageData=null,quotaData=null,usageNetError='',quotaNetError='',usageInFlight=false,quotaInFlight=false,quotaReadAt=0;
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
const date=t=>t?new Date(t).toLocaleString('zh-CN',{hour12:false}):'未记录';
const age=t=>{if(!t)return'暂无活动';const n=Math.max(0,Math.floor((Date.now()-t)/1000));return n<60?n+' 秒前':Math.floor(n/60)+' 分钟前'};
const sessionModes={new:'新会话',resume:'续接会话',unknown:'未记录'};
const feedStatus={loading:'读取中',available:'可用',unavailable:'不可用',stale:'已过期'};
const fmtCount=v=>v===null||v===undefined?'未提供':typeof v==='number'?v.toLocaleString('zh-CN'):String(v);
const timeOfDay=t=>t?new Date(t).toLocaleTimeString('zh-CN',{hour12:false}):'未提供';
const metaCell=(name,value)=>{const c=el('div');c.append(el('span',name),el('strong',value));return c};
const sessionModeText=job=>{const mode=sessionModes[job.sessionMode]||sessionModes.unknown;return job.sessionMode==='resume'&&job.resumedFrom?mode+' · 续接自 '+job.resumedFrom:mode};
const attachmentsText=job=>{const n=job.attachmentCount;const base=n===null||n===undefined?'未提供':n+' 个';return job.attachments?.length?base+'：'+job.attachments.join('、'):base};
const resetText=v=>v===null||v===undefined?'未提供':typeof v==='number'?date(v):String(v);
const typeValue=job=>job.jobKind==='local'?`${kinds.local} · ${job.model||'本地脚本'}`:`${kinds.glm} · ${job.model||'GLM-5.3-Flash'} / ${job.effort||'max'}`;
function badge(job){
 if(!job.superseded){let text=labels[job.phase]||job.phase;if(job.chainIssue==='cycle')text+=' · 后续链接成环';else if(job.chainIssue==='missing')text+=' · 后续登记缺失';return el('span',text,'badge '+job.phase)}
 const note=job.chainIssue==='cycle'?'链接成环':job.chainIssue==='missing'?'登记缺失':successorNotes[job.chainTip?.phase]||'后继状态未知';
 return el('span','历史'+(labels[job.phase]||job.phase)+' · '+note,'badge '+(job.resolved?'resolved':job.phase));
}
function successorBanner(job){
 const banner=el('div',undefined,'notice');
 if(job.chainIssue==='cycle'||!job.chainTip){banner.append(el('div',job.chainIssue==='cycle'?'本任务的后继链接形成环，无法确认已解决；以下原始结论原样保留，请人工核对登记。':'后继任务登记暂不可读；本任务不自动视为已解决，原始结论保留如下。'));return banner}
 banner.append(el('div',`这是已被取代的历史轮次；最终任务：${job.chainTip.title}（${labels[job.chainTip.phase]||job.chainTip.phase}）。${job.resolved?'该修正链已复核通过。':'原始失败与验收记录保留如下。'}`));
 const jump=el('button',job.resolved?'查看最终任务':'前往当前任务');
 jump.onclick=()=>{selected=job.chainTip.id;lastSignature='';render(lastJobs,lastSummary)};
 const wrap=el('div',undefined,'toolbar');wrap.append(jump);banner.append(wrap);
 return banner;
}
function chainPath(job,jobs){
 const path=[job],seen=new Set([job.id]);let cur=job;
 while(path.length<=jobs.length){const next=cur.followup&&jobs.find(j=>j.id===cur.followup.id);if(!next||seen.has(next.id))break;seen.add(next.id);path.push(next);cur=next}
 return path;
}
function usageSection(job,forceOpen){
 const sec=el('section');sec.id='usage-block';
 sec.append(el('h3','Token 用量（会话累计）'));
 if(job.jobKind==='local'){sec.append(el('p','本机门禁不调用模型，无 Token 用量。','muted'));return sec}
 sec.append(el('p','以下为 Zcode 原生去重口径的累计用量，并非计费 Token。续接会话保留先前累计，不单计本轮任务；多任务之间不汇总，也不折算费用。','muted'));
 const head=el('div',undefined,'meta');
 head.append(metaCell('会话',sessionModeText(job)),metaCell('附件',attachmentsText(job)),metaCell('CLI 版本',job.cliVersion||'未记录'));
 sec.append(head);
 const status=el('p',undefined,'muted');
 if(!usageData)status.textContent='正在读取会话用量…';
 else{const bits=[(feedStatus[usageData.status]||usageData.status)+(usageData.status==='stale'?'（保留上次数据）':'')];if(usageData.source)bits.push('来源 '+usageData.source);bits.push('更新于 '+date(usageData.updatedAt));status.textContent=bits.join(' · ')}
 sec.append(status);
 if(usageNetError)sec.append(el('div',usageNetError,'notice'));
 if(usageData?.message)sec.append(el('div',usageData.message,usageData.status==='available'?'muted':'notice'));
 const session=job.sessionId&&usageData?.sessions?usageData.sessions[job.sessionId]:null;
 if(!session){sec.append(el('p',job.sessionId?'该会话暂无用量记录（未提供）。':'会话尚未建立，暂无用量（未提供）。','muted'));return sec}
 const metrics=el('div',undefined,'meta usage-counts');
 for(const [name,key] of [['总Token','totalTokens'],['输入','inputTokens'],['输出','outputTokens'],['缓存读取','cacheReadTokens'],['请求数','modelRequestCount'],['失败请求','modelErrorCount']])metrics.append(metaCell(name,fmtCount(session[key])));
 sec.append(metrics);
 const det=el('details');det.open=forceOpen!==undefined?forceOpen:lastOpenPanels.has('明细与数据来源');
 const extra=['缓存写入：'+fmtCount(session.cacheCreationTokens),'推理：'+fmtCount(session.reasoningTokens),'数据范围：'+(session.scope||'未提供'),'会话状态：'+(feedStatus[session.status]||session.status||'未提供'),'会话更新于：'+date(session.updatedAt)];
 if(session.message)extra.push('说明：'+session.message);
 det.append(el('summary','明细与数据来源'),el('pre',extra.join('\n')));
 sec.append(det);
 return sec;
}
function renderUsageBlockIfSelected(){const block=document.getElementById('usage-block');if(!block)return;const job=lastJobs.find(j=>j.id===selected);if(!job)return;const wasOpen=block.querySelector('details')?.open;block.replaceWith(usageSection(job,wasOpen))}
function renderQuotaRegion(){
 const area=document.getElementById('quota-region');if(!area)return;area.replaceChildren();
 const head=el('div',undefined,'quota-head');head.append(el('strong','账号额度'));
 const q=quotaData;const status=el('span',undefined,'quota-status '+(q?'q-'+q.status:'q-loading'));
 if(!q)status.textContent='正在读取账号额度…';
 else{const bits=[(feedStatus[q.status]||q.status)+(q.status==='stale'?'（保留上次数据）':'')];if(q.source)bits.push('来源 '+q.source);bits.push('最近采集 '+date(q.updatedAt));if(q.refreshAfter)bits.push('下次自动 '+date(q.refreshAfter));status.textContent=bits.join(' · ')}
 head.append(status);
 const btn=el('button','刷新额度');btn.disabled=quotaInFlight;btn.onclick=async()=>{btn.disabled=true;btn.textContent='读取中…';await refreshQuota()};
 head.append(btn);
 if(quotaReadAt)head.append(el('span','本页读取 '+timeOfDay(quotaReadAt),'quota-status'));
 const link=document.createElement('a');link.textContent='官方用量页';link.href='https://www.bigmodel.cn/coding-plan/personal/usage';link.target='_blank';link.rel='noopener noreferrer';head.append(link);
 area.append(head);
 area.append(el('div','共享账号额度不代表单个任务费用。当前委派额度与桌面套餐分开展示；桌面快照保留原始采样时间。','muted'));
 if(quotaNetError)area.append(el('div',quotaNetError,'notice'));
 if(q?.message)area.append(el('div',q.message,q.status==='available'?'muted':'notice'));
 if(q?.accounts?.length){
  const wrap=el('div',undefined,'quota-accounts');
  for(const account of q.accounts){
   const box=el('div',undefined,'quota-account');
   box.append(el('div',[account.provider,account.plan].map(v=>v||'未提供').join(' · '),'quota-title'));
   if(account.scope)box.append(el('div','范围：'+account.scope,'quota-scope'));
   if(account.source||account.updatedAt)box.append(el('div',`${feedStatus[account.status]||'未确认'} · ${account.source||'来源未提供'} · ${date(account.updatedAt)}`,'quota-scope q-'+account.status));
   const metrics=el('div',undefined,'quota-metrics');
   for(const metric of account.metrics||[])metrics.append(el('span',(metric.label||'未提供')+'：'+(metric.value===null||metric.value===undefined?'未提供':fmtCount(metric.value)+(metric.unit?' '+metric.unit:'')),'quota-metric'));
   box.append(metrics,el('div',(account.resetLabel||'重置')+'：'+resetText(account.resetAt),'quota-scope'));
   if(account.expiresAt)box.append(el('div','到期：'+resetText(account.expiresAt),'quota-scope'));
   wrap.append(box);
  }
  area.append(wrap);
 }else if(q&&!quotaNetError)area.append(el('div','暂无账号额度数据（未提供）。','muted'));
}
async function fetchFeed(name){const response=await fetch(name,{cache:'no-store',signal:AbortSignal.timeout(5000)});if(!response.ok){const error=new Error('HTTP '+response.status);error.status=response.status;throw error}return response.json()}
async function refreshUsage(){if(usageInFlight||document.hidden)return;usageInFlight=true;try{usageData=await fetchFeed('usage');usageNetError=''}catch(error){
 if(error.status===404){if(usageData)usageNetError='用量接口在本机服务上未提供（404）；保留上次数据，任务状态不受影响。';else usageData={status:'unavailable',source:null,updatedAt:null,message:'本机服务未提供用量接口；任务状态不受影响。',sessions:{}}}
 else usageNetError=error.name==='TimeoutError'?'用量读取超时（5 秒无应答）；保留上次数据。':'用量接口暂时不可读（'+error.message+'）；保留上次数据。'}
 finally{usageInFlight=false;renderUsageBlockIfSelected()}}
async function refreshQuota(){if(quotaInFlight||document.hidden)return;quotaInFlight=true;try{quotaData=await fetchFeed('quota');quotaNetError='';quotaReadAt=Date.now()}catch(error){
 if(error.status===404){if(quotaData)quotaNetError='额度接口在本机服务上未提供（404）；保留上次数据，任务状态不受影响。';else quotaData={status:'unavailable',source:null,updatedAt:null,lastAttemptAt:null,refreshAfter:null,message:'本机服务未提供账号额度接口；任务状态不受影响。',accounts:[]}}
 else quotaNetError=error.name==='TimeoutError'?'额度读取超时（5 秒无应答）；保留上次数据。':'额度接口暂时不可读（'+error.message+'）；保留上次数据。'}
 finally{quotaInFlight=false;renderQuotaRegion()}}
function renderHealth(job){const area=document.getElementById('runtime-health');if(!area)return;area.replaceChildren();if(job.phase!=='running')return;if(job.jobKind==='local'){area.append(el('div','本机门禁进程仍在运行；该类型任务执行本地测试门禁，不发送模型请求。','notice'));return}const signal=job.modelSignal;let message='进程仍在运行；暂无当前请求信号，不能确认生成进度。';if(signal?.signal==='request_started')message=`最近请求已于 ${date(signal.requestStartedAt)} 发出（${age(signal.requestStartedAt)}），尚无对应完成信号。生成进度不可直接观测。${signal.responseAt?' 上次响应完成：'+date(signal.responseAt)+'。':''}`;else if(signal?.signal==='response_completed')message=`最近模型响应：${date(signal.responseAt)}（${age(signal.responseAt)}）。进程仍在运行。`;else if(signal?.signal==='request_failed')message='最近模型请求失败；进程仍在运行，请查看后续重试结果。';area.append(el('div',message,'notice'));if(signal?.lengthStops)area.append(el('p',`本轮有 ${signal.lengthStops} 次响应达到输出预算；最高思考档保持不变，单次响应结束不代表整个任务完成。`,'notice'));if(job.lastToolAt&&Date.now()-job.lastToolAt>600000)area.append(el('p',`超过 10 分钟没有完成新的工具操作（最近：${date(job.lastToolAt)}）。这与模型请求状态分开统计，暂不能据此判定卡死。`,'notice'))}
function countSummary(current){let running=0,awaiting=0,attention=0;for(const job of current){if(job.phase==='running')running++;else if(job.phase==='awaiting_review')awaiting++;else if(attentionPhases.includes(job.phase))attention++}return{running,awaitingReview:awaiting,needsAttention:attention}}
function summaryLine(current,summary){
 const line=el('div',undefined,'summary');
 line.append(el('strong',`当前任务 ${current.length}`),el('small',`${summary.running||0} 运行中 · ${summary.awaitingReview||0} 待验收 · ${summary.needsAttention||0} 需关注（已被后继取代的历史轮次折叠在下，不计入重复计数）`));
 return line;
}
function navButton(job){
 const button=el('button');
 button.className=job.id===selected?'selected':'';
 button.append(badge(job),el('strong',job.title),el('small',job.branch||job.id));
 button.onclick=()=>{selected=job.id;lastSignature='';render(lastJobs,lastSummary)};
 return button;
}
function render(jobs,summary){lastOpenPanels=new Set([...document.querySelectorAll('article details[open] summary')].map(e=>e.textContent));const historyOpen=document.getElementById('history-group')?.open;lastJobs=jobs;const current=jobs.filter(j=>!j.superseded),history=jobs.filter(j=>j.superseded);lastSummary=summary||countSummary(current);if(!jobs.some(j=>j.id===selected))selected=(current[0]||jobs[0])?.id;const nav=document.getElementById('jobs');nav.replaceChildren(summaryLine(current,lastSummary));for(const job of current)nav.append(navButton(job));if(history.length){const group=el('details');group.id='history-group';group.append(el('summary',`历史轮次 · 已被后续任务取代（${history.length}），展开检查原始记录`));for(const job of history)group.append(navButton(job));group.open=history.some(j=>j.id===selected)||(historyOpen??false);nav.append(group);if(group.open)group.querySelector('button.selected')?.scrollIntoView({block:'nearest'})}const job=jobs.find(j=>j.id===selected),detail=document.getElementById('detail');detail.replaceChildren();if(!job){detail.append(el('div','尚未登记任务','empty'));return}detail.append(badge(job),el('h2',job.title),el('div',job.worktree,'path'));if(job.superseded)detail.append(successorBanner(job));const meta=el('div',undefined,'meta');for(const [name,value]of [['类型 / 模型',typeValue(job)],['开始 / 结束',`${date(job.startedAt)} → ${job.finishedAt?date(job.finishedAt):'—'}`],['最近工具操作',`${date(job.lastToolAt)} · ${age(job.lastToolAt)}`]]){const cell=el('div');cell.append(el('span',name),el('strong',value));meta.append(cell)}detail.append(meta);detail.append(usageSection(job));
 const health=el('div');health.id='runtime-health';detail.append(health);renderHealth(job);
 if(job.phase==='awaiting_review')detail.append(el('div',job.jobKind==='local'?'本机门禁已结束。以下输出由本地脚本生成，尚不等于集成人验收通过。':'GLM 已结束本项开发。以下答复由开发 Agent 提供，尚不等于集成人验收通过。','notice'));
 if(job.error||job.warning)detail.append(el('div',[job.error,job.warning].filter(Boolean).join('\n'),'notice'));
 if(job.review){const sec=el('section');sec.append(el('h3','本轮验收反馈'),el('p',job.review.summary||job.review.state));if(job.followup){const next=el('button',`查看后续任务：${job.followup.title}（${labels[job.followup.phase]||job.followup.phase}）`);next.onclick=()=>{selected=job.followup.id;lastSignature='';render(lastJobs,lastSummary)};const wrap=el('div',undefined,'toolbar');wrap.append(next);sec.append(wrap)}else if(job.followupId&&!job.superseded)sec.append(el('p','后续任务登记暂不可读；原验收结论保留。'));detail.append(sec)}
 const hops=chainPath(job,jobs);
 if(hops.length>1){const sec=el('section');sec.append(el('h3','轮次链（旧 → 新）'));const row=el('div',undefined,'chain');hops.forEach((hop,index)=>{if(index)row.append(el('span','→','arrow'));const chip=el('button',`第${index+1}轮 · ${labels[hop.phase]||hop.phase}`);if(hop.id===job.id)chip.className='here';else chip.onclick=()=>{selected=hop.id;lastSignature='';render(lastJobs,lastSummary)};row.append(chip)});sec.append(row);detail.append(sec)}
 const prompt=el('details');prompt.append(el('summary','查看本次任务要求'),el('pre',job.prompt||'未记录 Prompt'));detail.append(prompt);
 if(job.response){const sec=el('section');sec.append(el('h3',job.jobKind==='local'?'门禁输出结论':'GLM 完成答复'),el('pre',job.response));detail.append(sec)}
 const sec=el('section');sec.append(el('h3','最近工具操作'));if(!job.activity?.length)sec.append(el('p','暂无工具记录；待派发任务和模型开始思考时可能出现此状态。'));for(const a of job.activity||[]){const row=el('div',undefined,'activity'),desc=el('div',a.description,'desc');desc.append(el('small',statuses[a.status]||a.status));row.append(el('time',date(a.at)),el('span',a.tool,'tool'),desc);sec.append(row)}detail.append(sec);
 const info=el('details');info.append(el('summary','日志与运行信息'),el('pre',`任务：${job.id}\n类型：${kinds[job.jobKind]||kinds.glm}\n会话：${job.sessionId||'尚未建立'}\n会话模式：${sessionModeText(job)}\nCLI 版本：${job.cliVersion||'未记录'}\n日志：${job.logPath||'未记录'}\n配置上下文：${job.contextConfigured||1000000}（实际生效容量未核实）\n刷新：窗口打开时每 5 秒读取本机状态；用量与额度每 5 秒读取本机缓存（远端查询由服务端约 60 秒缓存，刷新按钮只重读缓存）。不发送模型请求。`));detail.append(info);const toolbar=el('div',undefined,'toolbar'),copy=el('button','复制日志路径');copy.onclick=async()=>{await navigator.clipboard.writeText(job.logPath||'');copy.textContent='已复制'};toolbar.append(copy);detail.append(toolbar);for(const panel of detail.querySelectorAll('details'))panel.open=lastOpenPanels.has(panel.querySelector('summary')?.textContent)}
async function refresh(){if(refreshing||document.hidden)return;refreshing=true;try{const response=await fetch('state',{cache:'no-store',signal:AbortSignal.timeout(5000)});if(!response.ok)throw new Error('状态服务返回 '+response.status);const data=await response.json();document.getElementById('connection').textContent='本机监控已连接';document.getElementById('refreshed').textContent='更新于 '+date(data.generatedAt);document.getElementById('error').textContent=data.warnings.join('；');const signature=JSON.stringify([data.jobs,data.summary]);if(signature!==lastSignature){lastSignature=signature;render(data.jobs,data.summary)}else{const current=data.jobs.find(j=>j.id===selected),stamp=document.querySelector('.meta div:last-child strong');if(current&&stamp){stamp.textContent=date(current.lastToolAt)+' · '+age(current.lastToolAt);renderHealth(current)}}}catch(error){document.getElementById('connection').textContent='连接已断开';document.getElementById('error').textContent='状态窗口暂时无法读取数据；这不代表 GLM 已停止。重新打开桌面上的“GLM 任务看板”可恢复服务。'}finally{refreshing=false}}
refresh();refreshUsage();refreshQuota();setInterval(refresh,5000);setInterval(refreshUsage,5000);setInterval(refreshQuota,5000);document.addEventListener('visibilitychange',()=>{refresh();refreshUsage();refreshQuota()});
</script></html>
